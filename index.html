<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Family Grocery Lists</title>
<style>
/* Minimal responsive styles (you can extract to styles.css) */
:root{--bg:#f7f7f8;--card:#fff;--accent:#2b7a78}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial}
body{background:var(--bg);padding:12px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app-title{font-weight:700}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px}
.container{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.list-sections{display:flex;flex-direction:column;gap:12px}
.section{padding:8px;border-radius:8px;background:#fafafa}
.row{display:flex;align-items:center;justify-content:space-between}
.item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px}
.item button{margin-left:8px}
.input{width:100%;padding:8px;border-radius:8px;border:1px solid #e6e6e6}
.small{font-size:0.9rem;color:#666}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media(min-width:700px){.container{grid-template-columns:320px 1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="app-title">Family Grocery Lists</div>
  <div>
    <button id="btn-new-list" class="btn">New list</button>
  </div>
</div>

<div class="container">
  <div class="card" id="lists-column">
    <div class="small">Your lists</div>
    <div id="lists" class="card-grid" style="margin-top:8px"></div>
  </div>
  <div class="card" id="main-column">
    <div id="list-area">Select a list to open it</div>
  </div>
</div>

<script>
const API_ROOT = '/api';
let state = { lists: [], current: null, token: localStorage.getItem('grocery:token') };

async function apiFetch(path, opts={}){
  const headers = opts.headers || {};
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  opts.headers = headers;
  const res = await fetch(API_ROOT + path, opts);
  if (!res.ok) throw await res.json();
  return res.json();
}

async function init(){
  try { await loadLists(); } catch(e){ console.error(e); }
  setupUI();
  // Poll for changes
  setInterval(pollLists, 2000);
}

async function pollLists(){
  try {
    const data = await apiFetch('/lists');
    const remote = data.lists;
    // simple merge: if different version for opened list, reload it
    state.lists = remote;
    renderLists();
    if (state.current) {
      const cur = await apiFetch('/lists/' + encodeURIComponent(state.current));
      if (cur.version && (!state.currentData || cur.version !== state.currentData.version)) {
        state.currentData = cur;
        renderCurrentList();
      }
    }
  } catch(e){ /* ignore */ }
}

async function loadLists(){
  const data = await apiFetch('/lists');
  state.lists = data.lists;
  renderLists();
}

function setupUI(){
  document.getElementById('btn-new-list').addEventListener('click', async ()=>{
    const name = prompt('New list name');
    if (!name) return;
    await apiFetch('/lists', { method: 'POST', body: JSON.stringify({ name }), headers: { 'Content-Type': 'application/json' } });
    await loadLists();
  });
}

function renderLists(){
  const container = document.getElementById('lists');
  container.innerHTML = '';
  for (const l of state.lists){
    const el = document.createElement('div');
    el.className = 'card';
    el.style.cursor='pointer';
    el.innerHTML = `<div style="font-weight:600">${escapeHtml(l.name)}</div><div class="small">id: ${l.id}</div>`;
    el.onclick = async ()=>{ state.current = l.id; state.currentData = await apiFetch('/lists/' + encodeURIComponent(l.id)); renderCurrentList(); };
    container.appendChild(el);
  }
}

function renderCurrentList(){
  const area = document.getElementById('list-area');
  if (!state.currentData) { area.innerHTML = 'Select a list to open it'; return; }
  const d = state.currentData;
  area.innerHTML = `
    <div class="row" style="margin-bottom:8px"><div style="font-weight:700">${escapeHtml(d.name)}</div>
      <div><button id="btn-reset" class="btn">Reset</button></div>
    </div>
    <div class="list-sections">
      <div class="section">
        <div class="small">To buy (List A)</div>
        <div id="listA"></div>
      </div>
      <div class="section">
        <div class="small">Available items (List B)</div>
        <div style="margin:8px 0"><input id="new-item" class="input" placeholder="Add item to available list and press Enter"></div>
        <div id="listB"></div>
      </div>
    </div>
  `;
  document.getElementById('btn-reset').addEventListener('click', async ()=>{ await resetList(); });
  const input = document.getElementById('new-item');
  input.addEventListener('keydown', async (e)=>{ if (e.key === 'Enter'){ const name = input.value.trim(); if (!name) return; addItemToB(name); input.value=''; }});

  // render listA and listB
  const listA = document.getElementById('listA');
  listA.innerHTML = '';
  // Sort listA according to orderB
  const orderIndex = {};
  d.orderB.forEach((id,i)=> orderIndex[id]=i);
  d.listA.sort((a,b)=> (orderIndex[a.id]||0) - (orderIndex[b.id]||0));
  for (const it of d.listA){
    const row = document.createElement('div');
    row.className='item';
    const text = document.createElement('div');
    text.textContent = it.name;
    if (it.bought) text.style.textDecoration = 'line-through';
    const btnBought = document.createElement('button'); btnBought.textContent = it.bought ? 'Unbuy' : 'Bought'; btnBought.className='btn';
    btnBought.onclick = ()=> toggleBought(it.id);
    const btnBack = document.createElement('button'); btnBack.textContent='Move back'; btnBack.onclick = ()=> moveAToB(it.id);
    row.appendChild(text); row.appendChild(btnBought); row.appendChild(btnBack);
    listA.appendChild(row);
  }

  const listB = document.getElementById('listB');
  listB.innerHTML = '';
  // render in orderB order
  const bMap = new Map(d.listB.map(x=>[x.id,x]));
  for (const id of d.orderB){
    const it = bMap.get(id);
    if (!it) continue;
    const row = document.createElement('div');
    row.className='item';
    const name = document.createElement('div'); name.textContent = it.name;
    const btnAdd = document.createElement('button'); btnAdd.textContent='Add'; btnAdd.className='btn'; btnAdd.onclick = ()=> moveBToA(it.id);
    const btnDel = document.createElement('button'); btnDel.textContent='Delete'; btnDel.onclick = ()=> deleteItemFromB(it.id);
    row.appendChild(name); row.appendChild(btnAdd); row.appendChild(btnDel);
    listB.appendChild(row);
  }
}

// Utility helpers for actions
async function addItemToB(name){
  const d = state.currentData;
  const id = generateId();
  d.listB.push({ id, name });
  d.orderB.push(id);
  await saveCurrent(d);
}

async function moveBToA(id){
  const d = state.currentData;
  const idx = d.listB.findIndex(x=>x.id===id);
  if (idx === -1) return;
  const item = d.listB.splice(idx,1)[0];
  // remove from orderB
  d.orderB = d.orderB.filter(x=>x!==id);
  d.listA.push({ id: item.id, name: item.name, bought: false });
  await saveCurrent(d);
}

async function moveAToB(id){
  const d = state.currentData;
  const idx = d.listA.findIndex(x=>x.id===id);
  if (idx === -1) return;
  const item = d.listA.splice(idx,1)[0];
  d.listB.push({ id: item.id, name: item.name });
  d.orderB.push(item.id);
  await saveCurrent(d);
}

async function toggleBought(id){
  const d = state.currentData;
  const it = d.listA.find(x=>x.id===id);
  if (!it) return;
  it.bought = !it.bought;
  await saveCurrent(d);
}

async function deleteItemFromB(id){
  const d = state.currentData;
  d.listB = d.listB.filter(x=>x.id!==id);
  d.orderB = d.orderB.filter(x=>x!==id);
  await saveCurrent(d);
}

async function resetList(){
  const d = state.currentData;
  // move all items back to listB (preserve order: append to orderB in existing orderB positions top->bottom, then items from A that weren't present)
  for (const it of d.listA){
    d.listB.push({ id: it.id, name: it.name });
    d.orderB.push(it.id);
  }
  d.listA = [];
  await saveCurrent(d);
}

async function saveCurrent(newData){
  // optimistic update locally
  state.currentData = newData;
  renderCurrentList();
  try{
    await apiFetch('/lists/' + encodeURIComponent(state.current), { method: 'PUT', body: JSON.stringify(newData), headers: { 'Content-Type': 'application/json' } });
    // success
  }catch(e){ console.error('save failed',e); }
}

function generateId(){
  return Math.random().toString(36).slice(2,12);
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]); }

// On load
window.addEventListener('load', async ()=>{
  // If no token, prompt for password (simple flow). For first-time deployment you should call /api/setup to set password.
  if (!state.token){
    const p = prompt('Enter app password');
    if (!p) return alert('Password required');
    try{
      const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ password: p }) });
      if (!res.ok) { alert('Invalid password'); return; }
      const data = await res.json();
      state.token = data.token; localStorage.setItem('grocery:token', state.token);
    }catch(e){ alert('Auth failed'); return; }
  }
  init();
});
</script>
</body>
</html>
